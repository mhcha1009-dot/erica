<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스마트 플래너</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f8fb;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    /* 상단 입력 섹션 */
    .input-section {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 102, 255, 0.08);
      border: 1px solid #e1effe;
    }
    .input-section h1 {
      font-size: 1.5rem;
      color: #1a56db;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 2px solid #e5edff;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #1a56db;
    }
    button {
      padding: 14px 28px;
      background-color: #1a56db;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1e429f;
    }

    /* 하단 출력 섹션 (2분할) */
    .output-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 400px;
    }
    @media (max-width: 768px) {
      .output-section { grid-template-columns: 1fr; }
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 102, 255, 0.05);
      border: 1px solid #e1effe;
      display: flex;
      flex-direction: column;
    }
    .card h2 {
      font-size: 1.2rem;
      color: #1e429f;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ebf5ff;
    }

    /* 타임테이블 스타일 */
    .timetable-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 500px;
    }
    .timetable-item {
      display: flex;
      align-items: center;
      background-color: #f0f7ff;
      padding: 12px 16px;
      border-radius: 8px;
      border-left: 4px solid #1a56db;
    }
    .timetable-time {
      font-weight: bold;
      color: #1a56db;
      width: 80px;
    }
    .timetable-task {
      flex: 1;
    }

    /* 설명 텍스트 스타일 */
    .description-text {
      line-height: 1.6;
      white-space: pre-wrap;
      color: #4b5563;
      overflow-y: auto;
      max-height: 500px;
    }

    .loading {
      text-align: center;
      color: #1a56db;
      font-weight: bold;
      display: none;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="input-section">
      <h1>✨ AI 스마트 하루 플래너</h1>
      <div class="input-group">
        <input type="text" id="userInput" placeholder="예: 오늘 시험공부 일정을 만들어줘, 주말 휴식 계획 짜줘" />
        <button onclick="generatePlan()">계획 짜기</button>
      </div>
    </div>

    <div class="loading" id="loading">AI가 즐거운 하루 계획을 생성하고 있습니다... 🚀</div>

    <div class="output-section">
      <div class="card">
        <h2>⏱️ 타임테이블</h2>
        <ul class="timetable-list" id="timetable">
          <li style="color: #9ca3af;">계획을 입력하면 여기에 시간이 표시됩니다.</li>
        </ul>
      </div>

      <div class="card">
        <h2>📝 상세 안내 & 팁</h2>
        <div class="description-text" id="description">
          계획을 입력하면 상세 설명이 여기에 출력됩니다.
        </div>
      </div>
    </div>
  </div>

  <script>
    let activeAlarms = [];

    // 알람 권한 요청
    if ("Notification" in window) {
      Notification.requestPermission();
    }

    async function generatePlan() {
      const prompt = document.getElementById('userInput').value.trim();
      if (!prompt) return alert("계획을 입력해 주세요!");

      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        document.getElementById('loading').style.display = 'none';

        if (data.error) {
          alert('오류 발생: ' + data.error);
          return;
        }

        renderPlan(data);
        scheduleAlarms(data.schedule);

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        alert('서버 요청 중 오류가 발생했습니다.');
      }
    }

    function renderPlan(data) {
      // 타임테이블 렌더링
      const timetableEl = document.getElementById('timetable');
      timetableEl.innerHTML = '';
      
      data.schedule.forEach(item => {
        const li = document.createElement('li');
        li.className = 'timetable-item';
        li.innerHTML = `
          <span class="timetable-time">${item.time}</span>
          <span class="timetable-task">${item.task}</span>
        `;
        timetableEl.appendChild(li);
      });

      // 상세 설명 렌더링
      document.getElementById('description').textContent = data.description;
    }

    // 시간 알람 등록 기능
    function scheduleAlarms(schedule) {
      // 기존 타이머 초기화
      activeAlarms.forEach(id => clearTimeout(id));
      activeAlarms = [];

      const now = new Date();

      schedule.forEach(item => {
        const [hours, minutes] = item.time.split(':').map(Number);
        const targetTime = new Date();
        targetTime.setHours(hours, minutes, 0, 0);

        // 미래의 시간일 경우에만 알람 등록
        const diffMs = targetTime.getTime() - now.getTime();
        if (diffMs > 0) {
          const timerId = setTimeout(() => {
            triggerAlarm(item.task);
          }, diffMs);
          activeAlarms.push(timerId);
        }
      });
    }

    function triggerAlarm(task) {
      alert(`🔔 [알람] 할 시간입니다:\n${task}`);
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("⏱️ 일정 알람", { body: task });
      }
    }
  </script>
</body>
</html>
